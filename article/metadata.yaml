 - doi:  10.3389/fpubh.2021.788376

# Don't forget to surround abstract with double quotes
abstract: |
  "We report a replication of Machine Learning Assisted Cervical Cancer Detection
  (Mehmood et al., Frontiers in Public Health, 2021), which proposes CervDetect,
  a pipeline combining Random Forest feature selection with a shallow neural
  network to predict cervical cancer biopsy outcomes from the UCI risk-factor
  dataset. We reimplemented the preprocessing, feature-selection and
  classification stages in open-source software from the published description.
  The published confusion matrix reproduces exactly: ours is identical, cell for
  cell, across all 858 observations, with 803 true negatives, 55 false negatives,
  and zero true or false positives. The reproduced classifier therefore assigns
  every observation to the negative class, and its 93.6% accuracy equals the
  majority-class baseline exactly. The behaviour is stable across random
  initialisations rather than incidental. We further find that the original's
  Table 4 reports a true-positive rate of 100%, which cannot be derived from its
  own published confusion matrix. We conclude that the reported accuracy is
  reproducible but uninformative, and that the study's detection claims are not
  supported by its own results."

